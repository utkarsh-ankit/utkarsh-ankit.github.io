<style>

[data-icon-path="/assets/images/orcid.png"] {

}

}

/* Google Scholar: replace the Font Awesome icon with your PNG */

  background: url('/assets/images/google_scholar.png') no-repeat center;

  display: inline-block;
  vertical-align: middle;
}

/* Hide the Font Awesome glyph underneath */
.author__urls a[href*="scholar.google.com"] i::before {
